name: Generar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK necesario
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Probar motor de rentabilidad y OCR
        run: |
          mkdir -p build-tests
          javac -encoding UTF-8 -d build-tests \
            app/src/main/java/com/local/ofertas/ProfitEngine.java \
            app/src/main/java/com/local/ofertas/OfferParser.java \
            tests/FinancialTest.java
          java -cp build-tests FinancialTest
      - name: Compilar APK de prueba
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar APK generado
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Entregar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Analizador-Vivo-V2206-Android14-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
